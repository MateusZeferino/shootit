<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sem conexão | Shootit</title>
    <style>
      body { box-sizing: border-box; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #fafaf9; color: #0f172a; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
      p { margin: 0 0 24px; color: #475569; }
      a { display: inline-block; padding: 10px 16px; border-radius: 10px; background: #0f172a; color: white; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>O painel, as galerias e o envio de fotos precisam de internet. Reconecte-se para continuar.</p>
      <a href="/login">Tentar novamente</a>
    </main>
  </body>
</html>
